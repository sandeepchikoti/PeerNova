server.port=8080

# Spring Datasource Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/peernova_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
peernova.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
peernova.jwt.expiration-ms=86400000

# CORS Configuration
peernova.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.peernova=DEBUG
